name: Tests

# The release workflow only runs on a tag, so without this nothing ever
# runs the suite on the way in. Every test here is standalone — each file
# is its own runner as well as a pytest module — so pytest is used only
# to collect them and report skips honestly.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PyQt6 imports QtGui through libEGL, which a headless runner does
      # not have. Without these the Qt tests do not fail — they skip, and
      # a green run would mean the navigator, markup, printing and layer
      # panel were never exercised at all.
      - name: Install the libraries Qt needs to load headless
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run the suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -v --tb=short -rs

      # A skipped Qt test is the failure mode this workflow exists to
      # catch: it looks like a pass. Fail the run if the offscreen
      # platform could not be brought up.
      - name: Check the Qt tests actually ran
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import os, sys
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          from PyQt6.QtWidgets import QApplication
          from PyQt6.QtGui import QColor
          QApplication([])
          print('Qt loaded offscreen; the Qt tests ran for real.')
          "
