name: Build and release

# Tag-driven: bump src/version.py, commit, then
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # required to create the release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Resolve version and check it matches the tag
        id: ver
        shell: pwsh
        run: |
          # Import the value rather than regexing the file: a regex here
          # needs escaped double quotes inside a PowerShell string, which
          # PowerShell mangles before Python ever sees it.
          # Out-String guards against PowerShell handing back an array
          # instead of a string if Python ever emits more than one line.
          $v = (python -c "from src.version import __version__; print(__version__)" | Out-String).Trim()
          if (-not $v) {
            Write-Host "::error::Could not read __version__ from src/version.py"
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v?', ''
            if ($tag -ne $v) {
              # A mismatch would ship an installer whose filename, About box
              # and update check all disagree about the version.
              Write-Host "::error::Tag v$tag does not match src/version.py ($v). Bump version.py and re-tag."
              exit 1
            }
          }
          Write-Host "Building version $v"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean DWGViewer.spec

      - name: Smoke-test the build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DWG Viewer/DWG Viewer.exe")) {
            Write-Error "Build produced no executable"; exit 1
          }
          $size = (Get-ChildItem "dist/DWG Viewer" -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Build size: {0:N0} MB" -f $size)

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" "installer\DWGViewer.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: DWGViewer-Setup-${{ steps.ver.outputs.version }}
          path: dist_installer/*.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist_installer/*.exe
          generate_release_notes: true
          name: DWG Viewer ${{ steps.ver.outputs.version }}
